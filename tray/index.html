<!DOCTYPE html>
<html lang="de" data-product="quota-tray" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLIProxy Quota Tray · Live</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body { font-family: var(--mono); }
  .shell { max-width: 1120px; margin: 0 auto; padding: 22px 28px 40px; display: grid; gap: 14px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #0b1420; font-weight: 700; }
  h1 { font-family: var(--mono); font-size: 19px; letter-spacing: .02em; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .costgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 10px; }
  .costgrid strong { display: block; font-size: 17px; margin-top: 2px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .account { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .account:first-child { border-top: 0; padding-top: 0; }
  .windows { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .win { display: grid; gap: 5px; }
  .src { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
  .src:first-child { border-top: 0; padding-top: 0; }
  .tag { padding: 1px 7px; border-radius: 6px; background: var(--soft); color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .statusbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .keys { display: flex; gap: 16px; flex-wrap: wrap; }
  kbd { font-family: var(--mono); color: var(--accent); }
  [hidden] { display: none !important; }
  #live { min-height: 1em; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } .costgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">Q</span><div><h1>QUOTA TRAY</h1><small id="subtitle">Alle Anbieter · Quota und Verbrauch</small></div></div>
    <nav class="ui-nav" aria-label="Oberflächen"><a href="../live/">Live-Nutzung</a><a href="../tokscale/">Tokscale</a><a href="./" aria-current="page">Quota Tray</a></nav>
    <button id="theme" type="button" aria-label="Farbschema wechseln">Hell</button>
    <button id="refresh" type="button" class="primary" aria-label="Daten neu laden"></button>
  </header>
  <div class="ui-tabs" role="tablist" aria-label="Anbieter">
    <button role="tab" id="tab-all" aria-controls="app" aria-selected="true" data-filter="all">Übersicht</button>
    <button role="tab" id="tab-codex" aria-controls="app" aria-selected="false" tabindex="-1" data-filter="codex">ChatGPT</button>
    <button role="tab" id="tab-claude" aria-controls="app" aria-selected="false" tabindex="-1" data-filter="claude">Claude</button>
    <button role="tab" id="tab-other" aria-controls="app" aria-selected="false" tabindex="-1" data-filter="other">Weitere</button>
  </div>
  <p id="live" role="status" aria-live="polite"></p>
  <main id="app" role="tabpanel" aria-labelledby="tab-all" aria-busy="true"></main>
  <footer class="statusbar"><span id="poll"></span><span class="keys"><small><kbd>r</kbd> neu laden</small><small><kbd>t</kbd> Farbschema</small><small><kbd>←</kbd><kbd>→</kbd> Anbieter</small></span></footer>
</div>
<script type="module" src="tray.mjs"></script>
</body>
</html>
