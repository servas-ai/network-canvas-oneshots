<!DOCTYPE html>
<html lang="de" data-product="opencodex" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCodex · Live-Nutzung</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .shell { max-width: 1320px; margin: 0 auto; padding: 22px 28px 40px; display: grid; gap: 16px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #0b1420; font-weight: 700; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; }
  .quota { display: grid; gap: 10px; }
  .quota-row { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .quota-row:first-child { border-top: 0; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; }
  #live { min-height: 1em; }
  @media (max-width: 900px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">OC</span><div><h1>Live-Nutzung</h1><small>Lokale Codex- und Claude-Code-Sessions · keine Providerabfrage</small></div></div>
    <nav class="ui-nav" aria-label="Oberflächen"><a href="./" aria-current="page">Live-Nutzung</a><a href="../tokscale/">Tokscale</a></nav>
    <label><span class="sr-only">Zeitraum</span><select id="range"><option value="1">24 h</option><option value="7">7 Tage</option><option value="30" selected>30 Tage</option><option value="90">90 Tage</option></select></label>
    <button id="theme" type="button" aria-label="Farbschema wechseln">Hell</button>
    <button id="refresh" type="button" class="primary" aria-label="Daten neu laden"></button>
  </header>
  <p id="live" role="status" aria-live="polite"></p>
  <main id="app" aria-busy="true"></main>
</div>
<script type="module" src="dashboard.mjs"></script>
</body>
</html>
