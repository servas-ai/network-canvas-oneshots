<!DOCTYPE html>
<html lang="de" data-product="cliproxyapi-usage" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLIProxyAPI Usage · Live</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .shell { max-width: 1240px; margin: 0 auto; padding: 22px 28px 40px; display: grid; gap: 14px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #0b1420; }
  .mark svg { width: 18px; height: 18px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; }
  .share { display: grid; gap: 5px; padding: 8px 0; }
  .share .ui-meter > span { background: var(--accent); }
  .row { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 0; }
  .wins { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .scroll { overflow-x: auto; }
  .statusbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .keys { display: flex; gap: 16px; flex-wrap: wrap; }
  kbd { font-family: var(--mono); color: var(--accent); }
  #live { min-height: 1em; }
  @media (max-width: 900px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v12a4 4 0 0 0 4 4h10M5 8h9a4 4 0 0 1 4 4v8M2 4h6M15 17l3 3 3-3"/></svg></span>
      <div><h1>Usage analytics</h1><small id="subtitle">Tokenverbrauch, Konto-Kapazität und Quellen</small></div></div>
    <nav class="ui-nav" aria-label="Oberflächen"><a href="../live/">Live-Nutzung</a><a href="../opencodex/">Konten</a><a href="../tokscale/">Tokscale</a><a href="../tray/">Quota Tray</a><a href="./" aria-current="page">Usage</a><a href="../cpa/">Gateway</a></nav>
    <button id="theme" type="button" aria-label="Farbschema wechseln">Hell</button>
    <button id="export" type="button" aria-label="Daten als JSON exportieren" disabled></button>
    <button id="refresh" type="button" class="primary" aria-label="Daten neu laden"></button>
  </header>
  <div class="ui-tabs" role="tablist" aria-label="Ansicht">
    <button role="tab" id="tab-all" aria-controls="app" aria-selected="true" data-view="all">Übersicht</button>
    <button role="tab" id="tab-account" aria-controls="app" aria-selected="false" tabindex="-1" data-view="account">Nach Konto</button>
    <button role="tab" id="tab-model" aria-controls="app" aria-selected="false" tabindex="-1" data-view="model">Nach Modell</button>
    <button role="tab" id="tab-machine" aria-controls="app" aria-selected="false" tabindex="-1" data-view="machine">Nach Maschine</button>
  </div>
  <p id="live" role="status" aria-live="polite"></p>
  <main id="app" role="tabpanel" aria-labelledby="tab-all" aria-busy="true"></main>
  <footer class="statusbar"><span id="poll"></span><span class="keys"><small><kbd>r</kbd> neu laden</small><small><kbd>e</kbd> JSON-Export</small><small><kbd>t</kbd> Farbschema</small><small><kbd>←</kbd><kbd>→</kbd> Ansicht</small></span></footer>
</div>
<script type="module" src="usage.mjs"></script>
</body>
</html>
