<!DOCTYPE html>
<html lang="de" data-product="cc-switch" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Switch · Provider</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .shell { max-width: 1240px; margin: 0 auto; padding: 22px 28px 40px; display: grid; gap: 14px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
  .mark svg { width: 18px; height: 18px; }
  .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .provider { font-size: 20px; font-weight: 650; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .tool[data-kind="local"] { border-color: var(--accent); }
  .wins { display: grid; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--tint); color: var(--text); }
  .scroll { overflow-x: auto; }
  .statusbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .keys { display: flex; gap: 16px; flex-wrap: wrap; }
  kbd { font-family: var(--mono); color: var(--accent); }
  a.link { color: var(--accent); }
  #live { min-height: 1em; }
  @media (max-width: 1000px) { .tools, .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></span>
      <div><h1>CC Switch</h1><small id="subtitle">Provider, MCP-Server, Skills und Prompts von Claude Code, Codex und Gemini CLI auf dieser Maschine · nur lesend</small></div></div>
    <nav class="ui-nav" aria-label="Oberflächen"><a href="../live/">Live-Nutzung</a><a href="../opencodex/">Konten</a><a href="../tokscale/">Tokscale</a><a href="../tray/">Quota Tray</a><a href="../usage/">Usage</a><a href="../cpa/">Gateway</a><a href="../router/">Router</a><a href="./" aria-current="page">Switch</a></nav>
    <button id="theme" type="button" aria-label="Farbschema wechseln">Hell</button>
    <button id="export" type="button" aria-label="Daten als JSON exportieren" disabled></button>
    <button id="refresh" type="button" class="primary" aria-label="Daten neu laden"></button>
  </header>
  <div class="ui-tabs" role="tablist" aria-label="Ansicht">
    <button role="tab" id="tab-providers" aria-controls="app" aria-selected="true" data-view="providers">Provider</button>
    <button role="tab" id="tab-mcp" aria-controls="app" aria-selected="false" tabindex="-1" data-view="mcp">MCP-Server</button>
    <button role="tab" id="tab-skills" aria-controls="app" aria-selected="false" tabindex="-1" data-view="skills">Skills</button>
    <button role="tab" id="tab-files" aria-controls="app" aria-selected="false" tabindex="-1" data-view="files">Prompts und Backups</button>
  </div>
  <p id="live" role="status" aria-live="polite"></p>
  <main id="app" role="tabpanel" aria-labelledby="tab-providers" aria-busy="true"></main>
  <footer class="statusbar"><span id="poll"></span><span class="keys"><small><kbd>r</kbd> neu laden</small><small><kbd>e</kbd> JSON-Export</small><small><kbd>t</kbd> Farbschema</small><small><kbd>←</kbd><kbd>→</kbd> Ansicht</small></span></footer>
</div>
<script type="module" src="switch.mjs"></script>
</body>
</html>
